# N8-Hotspot – Projektdaten für scripts/n8-admin.sh (Update, Berechtigungen, sudo, Dienste)
N8_ID=n8hotspot
N8_NAME="N8-Hotspot"
N8_MAIN_UNIT=n8hotspot.service
N8_WEB_UNIT=n8hotspot.service
# Dienste in der Übersicht (Admin → System → Dienste): Unit|Bezeichnung|erlaubte Aktionen (leer = alle)
N8_UNITS=("mmdvmhost.service|MMDVMHost (Modem)" "dmrgateway.service|DMRGateway (DMR-Server)" "mosquitto.service|MQTT (Live-Daten)"
          "n8hotspot.service|Weboberfläche|restart enable" "n8hotspot-update.path|Update-Auslöser („Update jetzt“)")
N8_RESTART_UNITS=(dmrgateway.service mmdvmhost.service n8hotspot.service)
# dialout = Modem, systemd-journal/adm = Logs, gpio/i2c/spi = Hotspot-Platinen (nur wenn es die Gruppe gibt)
N8_GROUPS=(dialout systemd-journal adm gpio i2c spi)
N8_ROOT_UNITS="mosquitto.service"

n8_layout() {
    STATE_DIR="$APP/data"
    N8_DATA_DIRS=("$APP/data")
    # Datenbank (Passwörter, Sitzungen) und die ini-Dateien (Passwort des DMR-Servers) nur für den Dienst
    N8_SECRETS=("$APP/data/n8hotspot.db $APP/data/n8hotspot.db-wal|600" "$APP/data/MMDVM-Host.ini $APP/data/DMRGateway.ini|600")
    local port
    port="$(sed -n 's/^Environment=N8HS_PORT=//p' /etc/systemd/system/n8hotspot.service 2>/dev/null | head -1)"
    N8_HEALTH_URL="http://127.0.0.1:${port:-80}/api/auth/me"
}
n8_version() { tr -d '[:space:]' < "$APP/VERSION"; }

n8_units_from_templates() {   # systemd-Dienste aus systemd/*.service (Pfad und Web-Port bleiben)
    local s want port changed=0
    port="$(sed -n 's/^Environment=N8HS_PORT=//p' /etc/systemd/system/n8hotspot.service 2>/dev/null | head -1)"
    for s in mmdvmhost dmrgateway n8hotspot; do
        [[ -f "$APP/systemd/$s.service" ]] || continue
        want="$(sed "s#/opt/n8hotspot#${APP}#g; s#N8HS_PORT=80#N8HS_PORT=${port:-80}#" "$APP/systemd/$s.service")"
        if [[ "$want" != "$(cat "/etc/systemd/system/$s.service" 2>/dev/null)" ]]; then
            printf '%s\n' "$want" > "/etc/systemd/system/$s.service"; chmod 644 "/etc/systemd/system/$s.service"; changed=1
        fi
    done
    (( changed )) && systemctl daemon-reload >/dev/null 2>&1
    return 0
}
n8_post_update() {   # nach dem Vorspulen: Pakete, Dienste aus den Vorlagen, ini-Dateien neu, alte Reste
    local old="$1" new="$2"
    if git_ diff --name-only "$old" "$new" | grep -qx 'requirements.txt'; then
        "$APP/venv/bin/pip" install -q -r "$APP/requirements.txt" || return 1
    fi
    n8_units_from_templates
    # ini-Dateien aus der Datenbank neu schreiben (Generator könnte sich geändert haben) – als Dienst-Benutzer
    sudo -u "$SVC_USER" env N8HS_DATA="$APP/data" "$APP/venv/bin/python" -c \
        "import sys; sys.path.insert(0, '$APP'); from n8hotspot.__main__ import main; main(['', 'write-config'])" >/dev/null 2>&1 || true
    rm -f /etc/sudoers.d/n8hotspot          # bis 1.4: eigene Regel, jetzt /etc/sudoers.d/n8hotspot-n8admin
    return 0
}
n8_sudo_extra() {   # Befehle, die die Weboberfläche selbst nutzt (Einstellungen übernehmen, Kalibrierung, Neustart des Geräts)
    local SC="$1" s
    for s in mmdvmhost dmrgateway mosquitto; do
        echo "$SVC_USER ALL=(root) NOPASSWD: $SC start $s.service, $SC stop $s.service, $SC restart $s.service"
    done
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC restart n8hotspot.service, $SC reboot, $SC poweroff"
}

# ---------------------------------------------------------------- Modem-Schnittstelle (Raspberry Pi)
n8_modem_ports() {   # GPIO-UART, worauf /dev/serial0 zeigt, USB-Modems
    local p out=""
    for p in /dev/ttyAMA0 "$(readlink -f /dev/serial0 2>/dev/null)" /dev/ttyACM* /dev/ttyUSB*; do
        [[ -n "$p" && -e "$p" && " $out " != *" $p "* ]] && out="$out $p"
    done
    echo "$out"
}
n8_cmdline() { local c=/boot/firmware/cmdline.txt; [[ -f "$c" ]] || c=/boot/cmdline.txt; echo "$c"; }
n8_check_extra() {
    local p grp cmd model
    for p in $(n8_modem_ports); do
        if id "$SVC_USER" &>/dev/null && sudo -u "$SVC_USER" test -r "$p" -a -w "$p" 2>/dev/null; then
            ck ok hw "$SVC_USER darf $p öffnen ($(stat -c '%G %A' "$p"))"
        else
            grp=$(stat -c %G "$p"); ck bad hw "$SVC_USER darf $p nicht öffnen (Gruppe $grp) – Login-Konsole oder Gruppe dialout fehlt"
        fi
    done
    model="$( { tr -d '\0' < /proc/device-tree/model; } 2>/dev/null || true)"
    if [[ "$model" == *Raspberry* ]]; then
        cmd=$(n8_cmdline)
        if [[ -f "$cmd" ]] && grep -qE 'console=(serial0|ttyAMA0|ttyS0),[0-9]+ ?' "$cmd"; then
            ck bad hw "Linux-Konsole läuft auf der Modem-Schnittstelle ($cmd) – nach dem Korrigieren neu starten"
        else ck ok hw "keine Linux-Konsole auf der Modem-Schnittstelle"; fi
        if [[ "$(readlink -f /dev/serial0 2>/dev/null)" == /dev/ttyS0 && -e /dev/ttyAMA0 ]]; then
            ck warn hw "/dev/serial0 zeigt auf den Mini-UART (Bluetooth an) – dtoverlay=disable-bt in config.txt, dann neu starten"
        fi
    fi
    return 0
}
n8_fix_extra() {
    local p n cmd
    for p in $(n8_modem_ports); do
        if [[ "$(stat -c %G "$p")" == tty ]]; then   # eine Login-Konsole (getty) belegt die Schnittstelle
            n=$(basename "$p"); systemctl disable --now -q "serial-getty@$n.service" 2>/dev/null || true
            info "Login-Konsole auf $p abgeschaltet"
        fi
    done
    cmd=$(n8_cmdline)
    if [[ -f "$cmd" ]] && grep -qE 'console=(serial0|ttyAMA0|ttyS0),[0-9]+ ?' "$cmd"; then
        sed -i -E 's/console=(serial0|ttyAMA0|ttyS0),[0-9]+ ?//g' "$cmd"
        warn "Linux-Konsole von der Modem-Schnittstelle genommen – bitte einmal neu starten (sudo reboot)"
    fi
    n8_units_from_templates
    return 0
}
