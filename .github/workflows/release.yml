# GitHub release with the full description from CHANGELOG.md for every version.
#
# Runs when VERSION or CHANGELOG.md change on main (or a tag vX.Y.Z is pushed, or by hand):
# - no release for the version in VERSION yet  -> create tag vX.Y.Z on this commit + release
# - release exists                              -> update its text from CHANGELOG.md
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md, .github/workflows/release.yml]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and release notes
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(tr -d ' \n' < VERSION)"; fi
          python3 scripts/release.py --check
          python3 scripts/release.py --notes "$VERSION" > notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=v$VERSION – $(python3 scripts/release.py --date "$VERSION")" >> "$GITHUB_OUTPUT"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
          TITLE: ${{ steps.v.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi
